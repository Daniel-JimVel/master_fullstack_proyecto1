    <h1>ENEMY SPOTTED</h1>

    <main>
        <figure id="proto">
        <img src="Recursos/Proto Enemy Spotted.jpg" alt="Proto Enemy Spotted" title="Imagen del prototipo Enemy Spotted" width="700px" height="500px">

        <section>
            <div class="formularioproto">
                <p><b>Estado:</b> Finalizado</p>
                <p><b>Autor/es:</b> Pepe y David</p>
                <p><b>Categoría y Mecánica:</b> Enfretamientos, estrategia, jugadores ocasionales y experimentados. </p>
                <p><b>Nº de jugadores:</b> 2 </p>
                <p><b>Duración de la partida:</b> De 45 a 90 minutos</p>
                <p><b>Edad mínima:</b> 10 años</p>
                <p><b>Descripción del juego:</b></p>
            </div>

            <div class="descripcionproto">
                <p>En Enemy Spotted, los jugadores se ponen al mando de un equipo de agentes con el objetivo de plantar una bomba, o tratar de detener que eso ocurra</p>
                <p>Ambos jugadores tendrán que preparar sus mejores estrategias, usando 5 fichas de agente y 5 fichas de señuelo, ambas ocultas, para engañar al oponente y así lograr su objetivo.</p>
                <p>La estrategia no lo es todo, ya que a la hora del conflicto, serán las armas las que hablen, siendo importante llevar a los agentes bien equipados con distintas armas o chalecos y cascos.</p>
            </div>
        </section>
