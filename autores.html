    <section id="autores">
        <h1>Autores</h1>
            <div>
                
                <figure id="fotodani">
                    <img src="Recursos/Autor Dani.jpg" alt="Foto del autor Dani" title="Imagen del autor Dani" width="300px">
                        <figcaption>
                            <p>Nombre: Dani</p>

                            <p>Nacimiento: 02 Junio 1995</p>

                            <p>Juegos favoritos: Paleo, Fábulas de Peluche, Everdell.</p>

                            <p>Llevo jugando desde pequeño juegos de mesa. Empecé por el Misterios de Pekín y no he parado desde entonces. No le hago asco a ningún tipo de juego, pero mis favoritos son los cooperativos, los fillers y los de deducción.</p>

                        </figcaption>
                </figure>

                <figure id="fotopepe">
                    <img src="Recursos/Autor Pepe.jpg" alt="Foto del autor Pepe" title="Imagen del autor Pepe" width="300px">
                        <figcaption>
                            <p>Nombre: Pepe</p>

                            <p>Nacimiento: 25 Mayo 1993</p>

                            <p>Juegos favoritos: Pócimas y Brebajes, Starship Captains y Turing Machine.</p>

                            <p>Me gusta aprender de todo. Siempre he tenido los juegos muy presentes en mi vida desde las cartas hasta el Risk. Pero el día que me enseñaron Pócimas y Brebajes fue cuando me di cuenta de que este mundillo estaba hecho para mí.</p>
                        
                        </figcaption>
                </figure>

                <figure id="fotodavid">
                    <img src="Recursos/Autor David.jpg" alt="Foto del autor David" title="Imagen del autor David" width="300px">
                        <figcaption>
                            <p>Nombre: David</p>

                            <p>Nacimiento: 12 Mayo 1997</p>

                            <p>Juegos favoritos: Strike, Unmatched, Oca.</p>

                            <p>Me acoplé un día a una quedada de protos y aquí me he quedado. Soy un poco pesado pero hago buena crítica, así que les toca aguantarme.</p>
                        
                        </figcaption>
                </figure>

                <figure id="fotoivan">
                    <img src="Recursos/Autor Iván.jpeg" alt="Foto del autor Iván" title="Imagen del autor Iván" width="300px">
                        <figcaption>
                            <p>Nombre: Iván</p>

                            <p>Nacimiento: 3 Junio 1990</p>

                            <p>Juegos favoritos: Coffee Rush, Turing Machine, Caza Bombas y Red 7.</p>

                            <p>Soy un topo del gobierno ruso. Pero ellos no lo saben.</p>
                        
                        </figcaption>
                </figure>
            </div>
