    <h1>QUASAR ODYSSEY</h1>

    <main>
        <figure id="proto">
        <img src="Recursos/Proto Quasar Odyssey.jpg" alt="Proto Quasar Odyssey" title="Imagen del prototipo Quasar Odyssey" width="700px" height="500px">

        <section>
            <div class="formularioproto">
                    <p><b>Estado:</b> Finalizado</p>
                    <p><b>Autor/es:</b> Dani</p>
                    <p><b>Categoría y Mecánica:</b> Cooperativo, juego de cartas, comunicación limitada, familiar, jugadores ocasionales y experimentados.</p>
                    <p><b>Nº de jugadores:</b> De 1 a 4</p>
                    <p><b>Duración de la partida:</b> De 30 a 40 minutos</p>
                    <p><b>Edad mínima:</b> 10 años</p>
                    <p><b>Descripción del juego:</b></p>
            </div>

            <div class="descripcionproto">
                <p>Quasar Odyssey es un juego cooperativo de exploración espacial con comunicación limitada.</p>
                <p>Los jugadores tendrán que ir jugando cartas de acciones en la parte superior de una de las tres pilas que se encontrarán en el centro de la mesa. La carta jugada debe colocarse encima de otra que tenga escrita la misma acción o que sea del mismo color, si no no podrá jugarse.</p>
                <p>El objetivo del juego será completar todas las misiones que vayan apareciendo a medida que jugamos acciones durante la partida hasta cumplirlas todas. En caso de que las cartas de acción se acaben antes de que esto ocurra se perderá la partida.</p>
            </div>
        </section>
        </figure>
    </main>
